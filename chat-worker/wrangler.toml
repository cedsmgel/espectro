name = "espectro-chat"
main = "src/index.ts"
compatibility_date = "2026-10-30"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[observability]
enabled = true

# Rotina agendada (functions/_shared/maintenance.ts): de hora em hora
[triggers]
crons = ["7 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "espectro"
database_id = "6c7ef540-41b9-46c5-916c-3755b743d4de"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "espectro-midia"
