<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Espectro - Plataforma Social Conectada</title>
    <meta name="description" content="Espectro é uma rede social com comunidades, hashtags, scraps e chat. Converse, compartilhe e descubra gente com os mesmos interesses." />
    <meta property="og:site_name" content="Espectro" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />

    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Anti-FOUC Theme Script (executa antes da renderização) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('espectro-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Inter & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Caveat:wght@500;700&family=Comic+Neue:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Espectro" />
  </head>
