<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6B8E23" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão · Espectro</title>
    <style>
      :root {
        --bg: #f7f7f4;
        --fg: #1b1c18;
        --muted: #5d6056;
        --accent: #6b8e23;
        --card: #ffffff;
        --line: #deded5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --fg: #ececE6;
          --muted: #a1a396;
          --card: #151517;
          --line: #2a2b27;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 36px 28px;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        font-size: 28px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; text-wrap: balance; }
      p { margin: 0 0 24px; font-size: 14px; line-height: 1.55; color: var(--muted); text-wrap: pretty; }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:active { transform: scale(0.97); }
      .status { margin-top: 18px; margin-bottom: 0; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">E</div>
      <h1>Você está sem conexão</h1>
      <p>Não foi possível abrir o Espectro agora. Assim que a internet voltar, tudo continua de onde parou.</p>
      <button type="button" id="retry">Tentar de novo</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      var status = document.getElementById('status');
      function retry() {
        status.textContent = 'Tentando conectar...';
        window.location.reload();
      }
      document.getElementById('retry').addEventListener('click', retry);
      // Volta sozinho quando a conexão retorna
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
